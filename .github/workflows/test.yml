name: test

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python headers
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: Run tests
        run: cargo test --workspace
