[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "paged-kv"
version = "0.6.0"
description = "Paged KV blocks with stored f32 vectors and attention over those vectors"
requires-python = ">=3.8"

[tool.maturin]
features = ["extension-module"]
module-name = "paged_kv"
