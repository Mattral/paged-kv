[package]
name = "paged-kv-py"
version = "0.8.0"
edition = "2021"
description = "Python bindings for the paged-kv block pool and GPT-2 forward"
publish = false

[lib]
name = "paged_kv"
crate-type = ["cdylib"]

[dependencies]
paged-kv = { path = ".." }
pyo3 = { version = "0.30.1", features = ["auto-initialize"] }

[features]
extension-module = ["pyo3/extension-module"]
