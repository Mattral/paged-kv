[package]
name = "paged-kv-py"
version = "0.4.0"
edition = "2021"
description = "Python bindings for the paged-kv block pool and scheduler"
publish = false

[lib]
name = "paged_kv"
crate-type = ["cdylib"]

[dependencies]
paged-kv = { path = ".." }
pyo3 = { version = "0.30.1", features = ["auto-initialize"] }
