<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img">
  <title>Paged blocks fit more sequences than doubling or a max-length reserve.</title>
  <desc>Fixed budget of 65536 token slots. Lengths are context plus generated tokens from the Azure conversation trace, in timestamp order. Paged fits 75, doubling fits 50, and a max-length reserve of 14089 fits 4.</desc>
  <rect width="760" height="300" rx="12" fill="#ffffff" stroke="#e6e8ee"/>
  <text x="32" y="36" fill="#1a1a1a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">More sequences fit in the same 65,536 slots</text>
  <text x="32" y="58" fill="#5c6570" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Azure conversation trace, context plus generated tokens. Admission stops at the first request that does not fit.</text>

  <text x="32" y="96" fill="#1a1a1a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Paged, blocks of 16</text>
  <rect x="32" y="106" width="640" height="26" rx="4" fill="#eef1f4"/>
  <rect x="32" y="106" width="640" height="26" rx="4" fill="#e45756"/>
  <text x="684" y="124" fill="#1a1a1a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">75</text>

  <text x="32" y="166" fill="#1a1a1a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Contiguous, capacity doubles</text>
  <rect x="32" y="176" width="640" height="26" rx="4" fill="#eef1f4"/>
  <rect x="32" y="176" width="426.7" height="26" rx="4" fill="#4c78a8"/>
  <text x="684" y="194" fill="#1a1a1a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">50</text>

  <text x="32" y="236" fill="#1a1a1a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Max-length reserve of 14,089</text>
  <rect x="32" y="246" width="640" height="26" rx="4" fill="#eef1f4"/>
  <rect x="32" y="246" width="34.1" height="26" rx="4" fill="#f28e2b"/>
  <text x="684" y="264" fill="#1a1a1a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">4</text>
</svg>
