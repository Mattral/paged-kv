<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img">
  <title>Growing one token at a time is much slower with paged blocks</title>
  <desc>512 sequences grow to 260 tokens, one token at a time. Contiguous doubling median 0.250 ms, range 0.249 to 0.413 ms. Paged blocks median 5.423 ms, range 5.188 to 6.434 ms. The ranges do not overlap.</desc>
  <rect width="760" height="280" rx="12" fill="#ffffff" stroke="#e6e8ee"/>
  <text x="32" y="36" fill="#1a1a1a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">One token at a time, paged blocks are about 22× slower</text>
  <text x="32" y="58" fill="#5c6570" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">512 sequences, 260 tokens. Bar is the median. Whisker is the fastest to slowest of 21 runs.</text>

  <!-- 0 ms at x=32, 7 ms at x=720 -->
  <text x="32" y="96" fill="#1a1a1a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Contiguous, capacity doubles</text>
  <rect x="32" y="106" width="688" height="28" rx="4" fill="#eef1f4"/>
  <rect x="32" y="106" width="24.6" height="28" rx="4" fill="#4c78a8"/>
  <line x1="56.5" y1="120" x2="72.6" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="56.5" y1="112" x2="56.5" y2="128" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="72.6" y1="112" x2="72.6" y2="128" stroke="#1a1a1a" stroke-width="2"/>
  <text x="82" y="126" fill="#1a1a1a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">0.25 ms</text>

  <text x="32" y="162" fill="#1a1a1a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Paged blocks, block size 16</text>
  <rect x="32" y="172" width="688" height="28" rx="4" fill="#eef1f4"/>
  <rect x="32" y="172" width="533" height="28" rx="4" fill="#e45756"/>
  <line x1="541.9" y1="186" x2="664.5" y2="186" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="541.9" y1="178" x2="541.9" y2="194" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="664.5" y1="178" x2="664.5" y2="194" stroke="#1a1a1a" stroke-width="2"/>
  <text x="470" y="191" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">5.42 ms</text>

  <g fill="#5c6570" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">
    <line x1="32" y1="214" x2="720" y2="214" stroke="#d5d9e0"/>
    <line x1="32" y1="214" x2="32" y2="220" stroke="#8b93a0"/>
    <line x1="228.6" y1="214" x2="228.6" y2="220" stroke="#8b93a0"/>
    <line x1="425.1" y1="214" x2="425.1" y2="220" stroke="#8b93a0"/>
    <line x1="621.7" y1="214" x2="621.7" y2="220" stroke="#8b93a0"/>
    <text x="32" y="238" text-anchor="start">0</text>
    <text x="228.6" y="238" text-anchor="middle">2</text>
    <text x="425.1" y="238" text-anchor="middle">4</text>
    <text x="621.7" y="238" text-anchor="middle">6 ms</text>
  </g>
</svg>
