[package]
name = "paged-kv"
version = "0.7.0"
edition = "2021"
description = "Paged KV blocks with stored f32 vectors, a fixed-weight block, and FCFS batching"
readme = "README.md"
license = "MIT"
repository = "https://github.com/Mattral/paged-kv"

[workspace]
members = [".", "paged-kv-py"]
resolver = "2"

[[bench]]
name = "scheduler_overhead"
harness = false

[[bench]]
name = "alloc_load"
harness = false

[[bench]]
name = "paged_vs_contiguous"
harness = false

[[bench]]
name = "packing"
harness = false

[[bench]]
name = "prefix_sharing"
harness = false

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
hf-hub = { version = "1.0.0", features = ["blocking", "rustls-tls"] }
tokenizers = "0.23.2"

# The model matmuls are unusable at opt-level 0. This does not change the
# metadata benches; those still call BlockPool::new and were not remeasured.
[profile.dev.package.candle-core]
opt-level = 3

[profile.dev.package.candle-nn]
opt-level = 3
