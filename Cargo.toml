[package]
name = "paged-kv"
version = "0.1.0"
edition = "2021"
description = "Paged KV blocks with stored f32 vectors, one GPT-2 forward, and FCFS batching"
readme = "README.md"
license = "MIT"
repository = "https://github.com/Mattral/paged-kv"
keywords = ["kv-cache", "attention", "inference", "llm", "paging"]
categories = ["algorithms", "caching", "data-structures", "memory-management"]
rust-version = "1.87"

[features]
gpt2 = ["dep:candle-core", "dep:candle-nn", "dep:hf-hub", "dep:tokenizers"]

[workspace]
members = [".", "paged-kv-py"]
resolver = "2"

[[bench]]
name = "scheduler_overhead"
harness = false

[[bench]]
name = "alloc_load"
harness = false

[[bench]]
name = "paged_vs_contiguous"
harness = false

[[bench]]
name = "packing"
harness = false

[[bench]]
name = "prefix_sharing"
harness = false

[[example]]
name = "scheduled_attention"
required-features = ["gpt2"]

[dependencies]
candle-core = { version = "0.11.1", optional = true }
candle-nn = { version = "0.11.1", optional = true }
hf-hub = { version = "1.0.0", features = ["blocking", "rustls-tls"], optional = true }
tokenizers = { version = "0.23.2", optional = true }

# The model matmuls are unusable at opt-level 0. This does not change the
# metadata benches; those still call BlockPool::new and were not remeasured.
[profile.dev.package.candle-core]
opt-level = 3

[profile.dev.package.candle-nn]
opt-level = 3
