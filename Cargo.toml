[package]
name = "paged-kv"
version = "0.7.0"
edition = "2021"
description = "Paged KV blocks with stored f32 vectors, a fixed-weight block, and FCFS batching"
readme = "README.md"
license = "MIT"
repository = "https://github.com/Mattral/paged-kv"

[workspace]
members = [".", "paged-kv-py"]
resolver = "2"

[[bench]]
name = "scheduler_overhead"
harness = false

[[bench]]
name = "alloc_load"
harness = false

[[bench]]
name = "paged_vs_contiguous"
harness = false

[[bench]]
name = "packing"
harness = false

[[bench]]
name = "prefix_sharing"
harness = false
