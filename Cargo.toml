[package]
name = "paged-kv"
version = "0.4.0"
edition = "2021"
description = "Paged KV-cache blocks, FCFS batching, and optional Python bindings"
readme = "README.md"

[workspace]
members = [".", "paged-kv-py"]
resolver = "2"

[[bench]]
name = "scheduler_overhead"
harness = false

[[bench]]
name = "alloc_load"
harness = false

[[bench]]
name = "paged_vs_contiguous"
harness = false
